<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Counter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: antiquewhite;
      }
      .container {
        width: 600px;
        height: 400px;
        border: 1px solid black;
        border-radius: 10px;
        margin: 100px auto;
        background-color: gainsboro;
      }
      h2 {
        margin-top: 20%;
        margin-bottom: 30px;
        text-align: center;
        font-size: 2.5em;
      }
      h1 {
        margin-top: 40px;
        margin-bottom: 60px;
        text-align: center;
       
      }
      #btn {
        position: absolute;
        top: 30%;
        left: 50%;
        padding: 10px;
        transform: translate(-50%, -50%);
        
      }
      .btndiv {
        display: flex;
        justify-content: space-evenly;
        margin-top: 50px;
      }
      #btn1,
      #btn2,
      #btn3,
      #btn {
        background-color: #547066;
        border: none;
        color: white;
        padding: 10px 25px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="head">SIMPLE COUNTER</h1>
      <button onclick="textchange()" id="btn">TEXT CHANGE</button>
      <h2 id="count">0</h2>
      <div class="btndiv">
        <button onclick="increase()" id="btn1">Increase</button>
        <button onclick="decrease()" id="btn2">Dcrease</button>
        <button onclick="reset()" id="btn3">Reset</button>
      </div>

      <script>
        let count = 0;

        function increase() {
          count = count + 1;
          display();
        }

        function decrease() {
          if (count > 0) {
            count = count - 1;
            display();
          }
        }

        function reset() {
          count = 0;
          display();
        }

        function display() {
          let output = document.getElementById("count");
          output.innerText = count;
        }

        function textchange() {
          let output = document.getElementById("head");
          output.innerText = "COUNTER";
        }
      </script>
    </div>
  </body>
</html>
